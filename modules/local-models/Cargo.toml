[package]
name = "nucleus-local-models"
description = "Embedding models run inside nucleus on its own kernels: BERT-family encoders with their WordPiece and SentencePiece tokenizers, read from Hugging Face's files"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsarosi92/nucleus"
readme = "README.md"

# A module depends on nucleus's public API crates only, by version (the
# path is for building inside the repository; a published copy drops it).
[dependencies]
nucleus-sql = { version = "0.1.0", path = "../../crates/sql" }
# A model's files from Hugging Face's hub, over HTTPS.
nucleus-http = { version = "0.1.0", path = "../http" }
# tokenizer.json and config.json.
serde_json = "1"
# The machine's memory, which bounds a model's download.
nucleus-platform = { version = "0.1.0", path = "../../crates/platform" }

[dev-dependencies]
nucleus-kv = { version = "0.1.0", path = "../../crates/kv" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
