[package]
name = "nucleus-otlp"
description = "OpenTelemetry for nucleus: the metrics pushed to a collector over OTLP/HTTP (JSON)"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/davidsarosi92/nucleus"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
nucleus-http = { version = "0.1.0", path = "../http" }
nucleus-platform = { version = "0.1.0", path = "../../crates/platform" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
