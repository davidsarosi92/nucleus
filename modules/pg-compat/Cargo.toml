[package]
name = "nucleus-pg-compat"
description = "PostgreSQL compatibility for nucleus: the PostgreSQL protocol, pg_catalog and information_schema, the pg_* functions"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsarosi92/nucleus"
readme = "README.md"

# A module depends on nucleus's public API crates only, by version (the
# path is for building inside the repository; a published copy drops it).
[dependencies]
nucleus-kv = { version = "0.1.0", path = "../../crates/kv" }
nucleus-sql = { version = "0.1.0", path = "../../crates/sql" }
nucleus-server = { version = "0.1.0", path = "../../crates/server" }

[dev-dependencies]
nucleus-platform = { version = "0.1.0", path = "../../crates/platform" }
nucleus-testkit = { version = "0.1.0", path = "../../crates/testkit" }
postgres = "0.19.14"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
