[package]
name = "nucleus-tls"
description = "TLS for nucleus: rustls for the server's front ends and for the Rust client"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsarosi92/nucleus"
readme = "README.md"

# A module depends on nucleus's public API crates only, by version (the
# path is for building inside the repository; a published copy drops it).
[dependencies]
nucleus-server = { version = "0.1.0", path = "../../crates/server" }
nucleus-client = { version = "0.1.0", path = "../../crates/client" }
# TLS 1.2 and 1.3, with ring's cryptography (no C toolchain beyond a
# compiler for ring's assembly, no OpenSSL).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Mozilla's root certificates, for verifying a server without a CA file.
webpki-roots = "1"
# Hashes for SCRAM's tls-server-end-point channel binding (rustls's own).
ring = "0.17"

[dev-dependencies]
nucleus-kv = { version = "0.1.0", path = "../../crates/kv" }
nucleus-platform = { version = "0.1.0", path = "../../crates/platform" }
rcgen = "0.13"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
