name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Modules built to leave the repository (PLAN.md §M14.19): the boundary
  # check in both directions, and each module built and tested from its
  # packaged form alone.
  modules:
    name: module boundaries and detachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: modules
      - run: scripts/check-boundaries.py
      - run: scripts/detach-test.sh

  # The drivers (PLAN.md §M14.8) and the examples, against a real server.
  drivers:
    name: drivers (Rust, C, C++, Python, JS/TS, Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: drivers
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The Python driver's columnar results into numpy, Arrow, pandas and
      # polars (optional for the driver, tested here).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install numpy pyarrow pandas polars
      - run: cargo build --release --locked -p nucleus-cli -p nucleus-example
      - name: Driver tests
        # On failure the log's end is also an annotation (job logs need admin).
        run: |
          set -o pipefail
          if ! scripts/driver-tests.sh target/release/nucleus rust python js java c cpp 2>&1 | tee drivers.log; then
            tail -c 20000 drivers.log > failures.txt
            echo "::error title=driver tests failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi

  # The benchmark suite against PostgreSQL (PLAN.md §M14.11 L8, docs/
  # benchmarks.md): the table in the job summary, the numbers as an
  # artifact.  It fails only when a run fails.
  bench:
    name: benchmarks against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: cargo build --release --locked -p nucleus-cli
      - name: Run the suite
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: bench
        run: |
          set -o pipefail
          python3 bench/run.py --nucleus target/release/nucleus --rows 1000000 --json bench.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  # Every target in PLAN.md "Build targets".  `test: true` runs the tests on
  # that target (natively, or a 32-bit binary on a 64-bit kernel); the rest
  # are built, tests included, so they at least link.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  test: true }
          # musl: a C compiler for ring's code (the tls module) — musl-gcc,
          # or for i686 the multilib gcc (cc adds -m32).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  test: true, apt: musl-tools, cc: musl-gcc }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true, apt: musl-tools, cc: musl-gcc }
          - { os: ubuntu-latest,    target: i686-unknown-linux-musl,    test: true, apt: gcc-multilib, cc: gcc }
          - { os: macos-latest,     target: aarch64-apple-darwin,       test: true }
          - { os: macos-latest,     target: x86_64-apple-darwin,        test: false }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     test: true }
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target ${{ matrix.target }}
      - name: Install system packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: C compiler for the target
        if: matrix.cc
        shell: bash
        run: echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.test
        # On failure the panics are also emitted as annotations, which the
        # GitHub API serves without authentication (job logs need admin).
        run: |
          set -o pipefail
          if ! cargo test --workspace --target ${{ matrix.target }} 2>&1 | tee test.log; then
            grep -E -A6 "panicked at|^failures:|FAILED|error(\[|:)" test.log | head -c 20000 > failures.txt || true
            echo "::error title=tests failed on ${{ matrix.target }}::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi
      - name: psql against nucleus server
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          cargo build --target ${{ matrix.target }} --bin nucleus
          scripts/psql-smoke.sh target/${{ matrix.target }}/debug/nucleus
      - name: Long tests (ignored by default)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --target ${{ matrix.target }} -- --ignored
      - name: Build
        if: ${{ !matrix.test }}
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}
      - name: Package, unpack, run
        if: matrix.test
        run: |
          scripts/package.sh ${{ matrix.target }} dist
          for f in dist/*; do
            echo "== $f"
            rm -rf unpacked && mkdir unpacked
            case $f in
              *.zip) powershell -NoProfile -Command "Expand-Archive -Path '$f' -DestinationPath unpacked" ;;
              *) tar -C unpacked -xzf "$f" ;;
            esac
            ls -R unpacked | head -20
            top=$(ls unpacked)
            [ "$top" = "nucleus-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" ] || { echo "bad top directory: $top"; exit 1; }
            case $f in
              *-d-os-*)
                grep -q '^link=bin/nucleus /bin/nucleus' "unpacked/$top/.dos-app"
                echo QUIT | "unpacked/$top/bin/nucleus-settings" "$RUNNER_TEMP/settings-smoke" | grep -q '^BYE' ;;
            esac
            "unpacked/$top/bin/nucleus" --version
            "unpacked/$top/bin/ncsql" --help | grep -q '^usage: ncsql'
          done
