name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fuzz targets (their own workspace), checked as the rest is.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  # Modules built to leave the repository (PLAN.md §M14.19): the boundary
  # check in both directions, and each module built and tested from its
  # packaged form alone.
  modules:
    name: module boundaries and detachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: modules
      - run: scripts/check-boundaries.py
      - run: scripts/detach-test.sh

  # The drivers (PLAN.md §M14.8) and the examples, against a real server.
  drivers:
    name: drivers (Rust, C, C++, Python, JS/TS, Java, Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        # wasm32-wasip1: the browser's edition (js-wasm; Chrome is on the runner).
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: drivers
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The Python driver's columnar results into numpy, Arrow, pandas and
      # polars (optional for the driver, tested here).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install numpy pyarrow pandas polars
      - run: cargo build --release --locked -p nucleus-cli -p nucleus-example -p nucleus-embedded
      - name: Driver tests
        # On failure the log's end is also an annotation (job logs need admin).
        run: |
          set -o pipefail
          if ! scripts/driver-tests.sh target/release/nucleus rust python js java c cpp swift python-embedded js-embedded js-wasm 2>&1 | tee drivers.log; then
            tail -c 20000 drivers.log > failures.txt
            echo "::error title=driver tests failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi
      # The embedded edition's addon (built by the driver tests) under Bun
      # and Deno, which load Node-API addons too (PLAN.md §M14.23).
      - uses: oven-sh/setup-bun@v2
      - run: bun examples/js/anywhere.ts ":memory:"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run -A examples/js/anywhere.ts ":memory:"

  # The embedded edition on iOS (PLAN.md §M14.23 step 3): the XCFramework
  # (within its size budget), the Swift package's tests on macOS and on
  # the iOS simulator, and the example app run there.
  ios:
    name: iOS (Swift package, XCFramework, the simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target aarch64-apple-ios --target aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build, test, run the example
        # On failure the log's end is also an annotation (job logs need admin).
        run: |
          set -o pipefail
          run() {
            if ! "$@" 2>&1 | tee step.log; then
              tail -c 3800 step.log > failures.txt
              echo "::error title=ios: $1 failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
              exit 1
            fi
          }
          run env ARCHS=arm64 drivers/swift/build-xcframework.sh
          run swift test --package-path drivers/swift
          device=$(xcrun simctl list devices available | sed -n 's/^ *iPhone[^(]*(\([0-9A-F-]*\)).*/\1/p' | head -1)
          cd drivers/swift
          run xcodebuild test -quiet -scheme Nucleus-Package -destination "platform=iOS Simulator,id=$device,arch=arm64" -derivedDataPath ../../target/xcode
          cd ../..
          run examples/ios/run.sh "$device"
          # The engine's suites (platform conformance, storage, transactions,
          # SQL with slt) on the simulator.
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="xcrun simctl spawn $device"
          run cargo test --locked --target aarch64-apple-ios-sim -p nucleus-platform -p nucleus-storage \
            -p nucleus-txn -p nucleus-kv -p nucleus-sql

  # The embedded edition on Android (PLAN.md §M14.23 step 3): the native
  # libraries (arm64-v8a within its size budget), the library's tests —
  # the Java driver's cases among them — on an emulator, and the example
  # app run there.
  android:
    name: Android (AAR, the emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target aarch64-linux-android --target x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Native libraries
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" drivers/android/build-native.sh
      - name: The engine's suites for the emulator (built, run below)
        run: |
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_RUNNER=$PWD/scripts/adb-run.sh" >> "$GITHUB_ENV"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          cargo test --locked --no-run --target x86_64-linux-android -p nucleus-platform -p nucleus-storage \
            -p nucleus-txn -p nucleus-kv -p nucleus-sql
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests and the example on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd drivers/android && ./gradlew --no-daemon :nucleus:connectedDebugAndroidTest
            examples/android/run.sh
            cargo test --locked --target x86_64-linux-android -p nucleus-platform -p nucleus-storage -p nucleus-txn -p nucleus-kv -p nucleus-sql

  # The benchmark suite against PostgreSQL (PLAN.md §M14.11 L8, docs/
  # benchmarks.md): the table in the job summary, the numbers as an
  # artifact.  It fails only when a run fails.
  wasm:
    name: wasm32-wasip1 (the browser edition's engine, under Node's WASI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test (platform conformance, storage, transactions, SQL with slt)
        run: |
          set -o pipefail
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="node $PWD/scripts/wasi-run.mjs"
          if ! cargo test --locked --target wasm32-wasip1 -p nucleus-platform -p nucleus-storage \
              -p nucleus-txn -p nucleus-kv -p nucleus-sql 2>&1 | tee test.log; then
            grep -E -A6 "panicked at|^failures:|FAILED|error(\[|:)" test.log | head -c 3800 > failures.txt || true
            [ -s failures.txt ] || tail -c 3800 test.log > failures.txt
            echo "::error title=wasm tests failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi

  bench:
    name: benchmarks against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: cargo build --release --locked -p nucleus-cli
      - name: Run the suite
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: bench
        run: |
          set -o pipefail
          python3 bench/run.py --nucleus target/release/nucleus --rows 1000000 --json bench.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  # Fuzzing (PLAN.md §M14.29 S2, fuzz/README.md): every input that crosses
  # a trust boundary, a few minutes each change, from the seeds and the
  # corpus earlier runs grew.  A finding fails the job and is uploaded.
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [sql_parse, values, json, text_search, copy, ncp, pg_wire, scram, jwt, disk, model_files]
    env:
      # The sanitizer's build: warnings are lint's business.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for three minutes
        working-directory: fuzz
        # On failure the log's end is also an annotation (job logs need admin).
        run: |
          set -o pipefail
          mkdir -p corpus/${{ matrix.target }}
          # The stack a session's thread has (nucleus_platform::SESSION_STACK),
          # and more for AddressSanitizer's larger frames: the targets run
          # statements on the main thread.
          ulimit -s 262144
          # The target named: the installed cargo-fuzz is a musl build and
          # would default to its own (no sanitizer with a static libc).
          if ! cargo +nightly fuzz run -O --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- \
            -max_total_time=180 -rss_limit_mb=2048 -timeout=10 -print_final_stats=1 2>&1 | tee fuzz.log; then
            # An annotation keeps 4 KiB: the crash, not libFuzzer's progress.
            grep -vE '^\s*Compiling|^#[0-9]+\s' fuzz.log | tail -c 3800 > failures.txt
            echo "::error title=fuzz ${{ matrix.target }} failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  # Every target in PLAN.md "Build targets".  `test: true` runs the tests on
  # that target (natively, or a 32-bit binary on a 64-bit kernel); the rest
  # are built, tests included, so they at least link.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   test: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  test: true }
          # musl: a C compiler for ring's code (the tls module) — musl-gcc,
          # or for i686 the multilib gcc (cc adds -m32).
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  test: true, apt: musl-tools, cc: musl-gcc }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true, apt: musl-tools, cc: musl-gcc }
          - { os: ubuntu-latest,    target: i686-unknown-linux-musl,    test: true, apt: gcc-multilib, cc: gcc }
          - { os: macos-latest,     target: aarch64-apple-darwin,       test: true }
          - { os: macos-latest,     target: x86_64-apple-darwin,        test: false }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     test: true }
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --target ${{ matrix.target }}
      - name: Install system packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: C compiler for the target
        if: matrix.cc
        shell: bash
        run: echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=${{ matrix.cc }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.test
        # On failure the panics are also emitted as annotations, which the
        # GitHub API serves without authentication (job logs need admin).
        run: |
          set -o pipefail
          if ! cargo test --workspace --target ${{ matrix.target }} 2>&1 | tee test.log; then
            grep -E -A6 "panicked at|^failures:|FAILED|error(\[|:)" test.log | head -c 20000 > failures.txt || true
            echo "::error title=tests failed on ${{ matrix.target }}::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"
            exit 1
          fi
      - name: psql against nucleus server
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          cargo build --target ${{ matrix.target }} --bin nucleus
          scripts/psql-smoke.sh target/${{ matrix.target }}/debug/nucleus
      - name: Long tests (ignored by default)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --workspace --target ${{ matrix.target }} -- --ignored
      - name: Build
        if: ${{ !matrix.test }}
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}
      - name: Package, unpack, run
        if: matrix.test
        run: |
          scripts/package.sh ${{ matrix.target }} dist
          for f in dist/*; do
            echo "== $f"
            rm -rf unpacked && mkdir unpacked
            case $f in
              *.zip) powershell -NoProfile -Command "Expand-Archive -Path '$f' -DestinationPath unpacked" ;;
              *) tar -C unpacked -xzf "$f" ;;
            esac
            ls -R unpacked | head -20
            top=$(ls unpacked)
            [ "$top" = "nucleus-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" ] || { echo "bad top directory: $top"; exit 1; }
            case $f in
              *-d-os-*)
                grep -q '^link=bin/nucleus /bin/nucleus' "unpacked/$top/.dos-app"
                echo QUIT | "unpacked/$top/bin/nucleus-settings" "$RUNNER_TEMP/settings-smoke" | grep -q '^BYE' ;;
            esac
            "unpacked/$top/bin/nucleus" --version
            "unpacked/$top/bin/ncsql" --help | grep -q '^usage: ncsql'
          done
