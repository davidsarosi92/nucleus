[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "editions/*", "integrations/d-os", "examples/rust", "examples/extension"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsarosi92/nucleus"

[workspace.dependencies]
# Path and version: in the repository the path is used; a published
# crate keeps the version (PLAN.md §M14.19).
nucleus-crypto = { version = "0.1.0", path = "crates/crypto" }
nucleus-platform = { version = "0.1.0", path = "crates/platform" }
nucleus-storage = { version = "0.1.0", path = "crates/storage" }
nucleus-txn = { version = "0.1.0", path = "crates/txn" }
nucleus-kv = { version = "0.1.0", path = "crates/kv" }
nucleus-sql = { version = "0.1.0", path = "crates/sql" }
nucleus-server = { version = "0.1.0", path = "crates/server" }
nucleus-client = { version = "0.1.0", path = "crates/client" }
nucleus-testkit = { version = "0.1.0", path = "crates/testkit" }
nucleus-pg-compat = { version = "0.1.0", path = "modules/pg-compat" }
nucleus-tls = { version = "0.1.0", path = "modules/tls" }
nucleus-oidc = { version = "0.1.0", path = "modules/oidc" }
# Regular expressions for `~`: linear-time matching, so no pattern can
# stall the server.
regex = "1.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Tuple-heavy signatures read fine here; aliases would only add names.
type_complexity = "allow"

# The simulation tests replay workloads thousands of times; unoptimised they
# dominate the test run.  Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
