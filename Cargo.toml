[workspace]
resolver = "3"
members = ["crates/*", "integrations/d-os"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/davidsarosi92/nucleus"

[workspace.dependencies]
nucleus-platform = { path = "crates/platform" }
nucleus-storage = { path = "crates/storage" }
nucleus-txn = { path = "crates/txn" }
nucleus-kv = { path = "crates/kv" }
nucleus-sql = { path = "crates/sql" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Tuple-heavy signatures read fine here; aliases would only add names.
type_complexity = "allow"

# The simulation tests replay workloads thousands of times; unoptimised they
# dominate the test run.  Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
