[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "editions/*", "integrations/d-os", "examples/rust", "examples/extension", "examples/migrations/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/davidsarosi92/nucleus"

[workspace.dependencies]
# Path and version: in the repository the path is used; a published
# crate keeps the version (PLAN.md §M14.19).
nucleus-crypto = { version = "0.1.0", path = "crates/crypto" }
nucleus-platform = { version = "0.1.0", path = "crates/platform" }
nucleus-storage = { version = "0.1.0", path = "crates/storage" }
nucleus-txn = { version = "0.1.0", path = "crates/txn" }
nucleus-kv = { version = "0.1.0", path = "crates/kv" }
nucleus-sql = { version = "0.1.0", path = "crates/sql" }
nucleus-server = { version = "0.1.0", path = "crates/server" }
nucleus-client = { version = "0.1.0", path = "crates/client" }
nucleus-wire = { version = "0.1.0", path = "crates/wire" }
nucleus-testkit = { version = "0.1.0", path = "crates/testkit" }
nucleus-kernels = { version = "0.1.0", path = "crates/kernels" }
nucleus-pg-compat = { version = "0.1.0", path = "modules/pg-compat" }
nucleus-tls = { version = "0.1.0", path = "modules/tls" }
nucleus-oidc = { version = "0.1.0", path = "modules/oidc" }
nucleus-http = { version = "0.1.0", path = "modules/http" }
nucleus-embeddings = { version = "0.1.0", path = "modules/embeddings" }
nucleus-local-models = { version = "0.1.0", path = "modules/local-models" }
nucleus-ldap = { version = "0.1.0", path = "modules/ldap" }
nucleus-mcp = { version = "0.1.0", path = "modules/mcp" }
nucleus-console = { version = "0.1.0", path = "modules/console" }
nucleus-prometheus = { version = "0.1.0", path = "modules/prometheus" }
nucleus-otlp = { version = "0.1.0", path = "modules/otlp" }
nucleus-s3 = { version = "0.1.0", path = "modules/s3" }
nucleus-aws = { version = "0.1.0", path = "modules/aws" }
nucleus-aws-kms = { version = "0.1.0", path = "modules/aws-kms" }
nucleus-vault-transit = { version = "0.1.0", path = "modules/vault-transit" }
nucleus-gcp-kms = { version = "0.1.0", path = "modules/gcp-kms" }
nucleus-azure-kv = { version = "0.1.0", path = "modules/azure-kv" }
nucleus-pkcs11 = { version = "0.1.0", path = "modules/pkcs11" }
# Regular expressions for `~`: linear-time matching, so no pattern can
# stall the server.
regex = "1.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Tuple-heavy signatures read fine here; aliases would only add names.
type_complexity = "allow"

# The simulation tests replay workloads thousands of times; unoptimised they
# dominate the test run.  Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 1
