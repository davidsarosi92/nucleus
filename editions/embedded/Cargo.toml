[package]
name = "nucleus-embedded"
description = "nucleus inside an application: a database in memory or in a directory, its sessions over the nucleus protocol in the process, behind a C API (PLAN.md §M14.23)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "nucleus_embedded"
# A shared library for Python (ctypes) and Node (an addon loads it), a
# static one for Swift and Kotlin, and Rust's own.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["embeddings", "local-models"]
# Embedding models from providers' APIs (OpenAI, Voyage, Cohere, ...).
embeddings = ["dep:nucleus-embeddings"]
# Embedding models run in the process, their files from Hugging Face.
local-models = ["dep:nucleus-local-models"]

[dependencies]
nucleus-platform.workspace = true
nucleus-kv.workspace = true
nucleus-sql.workspace = true
nucleus-server.workspace = true
nucleus-embeddings = { workspace = true, optional = true }
nucleus-local-models = { workspace = true, optional = true }

# The workspace forbids unsafe code; this crate only denies it, so that
# its C API (`src/ffi.rs`), which takes pointers from C, can allow it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"

[dev-dependencies]
# The tests speak to the sessions as a Rust program would.
nucleus-client.workspace = true
# The slt suite, run in the process as the server runs it.
nucleus-testkit.workspace = true
