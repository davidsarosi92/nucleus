[package]
name = "nucleus-cli"
description = "The nucleus command-line tool: the full edition (every front end and module)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nucleus"
path = "src/main.rs"

# The SQL shell under its own name: `ncsql` is `nucleus sql`.
[[bin]]
name = "ncsql"
path = "src/ncsql.rs"

[dependencies]
nucleus-kv.workspace = true
nucleus-sql.workspace = true
nucleus-server.workspace = true
nucleus-client.workspace = true
nucleus-pg-compat.workspace = true
nucleus-tls.workspace = true
nucleus-oidc.workspace = true
nucleus-ldap.workspace = true

[lints]
workspace = true
