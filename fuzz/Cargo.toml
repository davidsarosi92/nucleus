[package]
name = "nucleus-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Fuzz targets for every input that crosses a trust boundary (PLAN.md §M14.29 S2)"

[package.metadata]
cargo-fuzz = true

# Its own workspace: built only by `cargo fuzz` (a nightly toolchain and
# sanitizers), never by the repository's `cargo build` and `cargo test`.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
nucleus-crypto = { path = "../crates/crypto" }
nucleus-kv = { path = "../crates/kv" }
nucleus-platform = { path = "../crates/platform" }
nucleus-server = { path = "../crates/server" }
nucleus-sql = { path = "../crates/sql" }
nucleus-storage = { path = "../crates/storage" }
nucleus-pg-compat = { path = "../modules/pg-compat" }
nucleus-oidc = { path = "../modules/oidc" }
nucleus-local-models = { path = "../modules/local-models" }
# Signs the tokens the `jwt` target makes (as an issuer would).
ring = "0.17"

[profile.release]
debug = 1

[[bin]]
name = "sql_parse"
path = "fuzz_targets/sql_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "values"
path = "fuzz_targets/values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_search"
path = "fuzz_targets/text_search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "copy"
path = "fuzz_targets/copy.rs"
