[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleus-db"
version = "0.1.0"
description = "Python driver for the nucleus database (the nucleus protocol, ncp)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/davidsarosi92/nucleus"

[tool.setuptools]
packages = ["nucleus"]
