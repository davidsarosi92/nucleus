[package]
name = "nucleus-sql"
description = "nucleus SQL layer: catalog, parser, planner, executor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nucleus-kv.workspace = true
nucleus-crypto.workspace = true
nucleus-kernels.workspace = true
# The machine's memory, which sizes the index cache (`object_cache`).
nucleus-platform.workspace = true
regex.workspace = true

[dev-dependencies]
# Path only: the test kit depends on this crate, so a published copy
# leaves the dev-dependency (and the tests that use it) out.
nucleus-testkit = { path = "../testkit" }
# Without fork and timeout (subprocesses): the tests run on WebAssembly too.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

[lints]
workspace = true
