[package]
name = "nucleus-platform"
description = "Injectable file system, clock and randomness for nucleus, with a deterministic fault-injecting simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom = "0.4.3"

[dev-dependencies]
# Without fork and timeout (subprocesses): the tests run on WebAssembly too.
proptest = { version = "1.12.0", default-features = false, features = ["std", "bit-set"] }

# The workspace forbids unsafe code; this crate only denies it, so that the
# two calls `std` cannot make on macOS — the ordered sync,
# `fcntl(F_BARRIERFSYNC)` (`src/real.rs`, `barrier_sync`), and the machine's
# memory, `sysctlbyname("hw.memsize")` (`physical_memory`) — can allow it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "allow"
